<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F1EBDC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Blink — Field Dossier Linux Host Telemetry. Direct /proc and /sys instrumentation with brutalist precision and clay tactility." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Blink // Field Dossier — Host Telemetry</title>
    <script>
      (function () {
        document.documentElement.classList.add('js');
        try {
          var stored = localStorage.getItem('blink-theme') || localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
