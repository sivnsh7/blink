<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Blink — Field Dossier">
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8267"/>
      <stop offset="100%" stop-color="#C93325"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBE0C4"/>
      <stop offset="50%" stop-color="#C2A05E"/>
      <stop offset="100%" stop-color="#715A26"/>
    </linearGradient>
  </defs>
  <!-- Brutalist Outer Case -->
  <rect width="32" height="32" rx="7" fill="#211C15" stroke="#9C7B3F" stroke-width="1.5"/>
  
  <!-- Tactile Lacquer Plate -->
  <rect x="4" y="4" width="24" height="24" rx="5" fill="url(#lacquer)" stroke="#211C15" stroke-width="1.5"/>
  
  <!-- Dossier Hexagonal Aperture Grid -->
  <path d="M16 7 L24 11.5 V20.5 L16 25 L8 20.5 V11.5 Z"
        fill="#211C15" stroke="url(#brass)" stroke-width="1.8" stroke-linejoin="round"/>
        
  <!-- Radar Reticle / Optical Eye -->
  <circle cx="16" cy="16" r="4.2" fill="none" stroke="#C2A05E" stroke-width="1.5" stroke-dasharray="3 1.5"/>
  <circle cx="16" cy="16" r="2" fill="#4FD8D8"/>
  <circle cx="20.5" cy="11.5" r="1.3" fill="#FFE2DC"/>
</svg>
